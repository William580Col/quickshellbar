# Copiar a: ~/.config/environment.d/quickshell-sway.conf
# Sway no tiene un "hl.env()" propio en su archivo de config — la wiki de
# Sway recomienda systemd environment.d para que estas variables estén
# listas ANTES de que arranque cualquier programa gráfico. Funciona si tu
# sesión se inicia vía systemd (la mayoría de display managers modernos:
# SDDM, GDM, greetd+systemd, uwsm).

XCURSOR_SIZE=24

LANG=es_CO.UTF-8
LC_ALL=es_CO.UTF-8

XDG_SESSION_TYPE=wayland
XDG_CURRENT_DESKTOP=sway
XDG_SESSION_DESKTOP=sway

# Variables para Steam y juegos (XWayland)
SDL_VIDEODRIVER=x11
XMODIFIERS=
WINE_FULLSCREEN_FOSS=1

# Apariencia GTK/Qt (portado tal cual del hyprland.lua original; si tienes
# problemas con Kvantum/qt6ct, revisa la conversación previa sobre
# QT_QPA_PLATFORMTHEME y QT_STYLE_OVERRIDE — este valor puede necesitar
# ajuste según qué motor de temas Qt uses)
ADW_DEBUG_COLOR_SCHEME=prefer-dark
QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=kde
QT_STYLE_OVERRIDE=Darkly
