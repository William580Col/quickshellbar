[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
opacity = 0.85
blur = true

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
