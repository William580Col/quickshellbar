# Compatibilidad con el prompt bash (oh-my-bash modern).
# Regenera el archivo que lee el prompt desde Matugen, para que el
# color primario (accent) siga al wallpaper como el resto del sistema.
# Generado por Matugen — no editar a mano.
mode = "dark"

# UI Colors (extended)
accent = "{{colors.primary.default.hex}}"
cursor = "{{colors.primary.default.hex}}"

# Primary colors
foreground = "{{colors.on_surface.default.hex}}"
background = "{{colors.background.default.hex}}"

# Selection colors
selection_foreground = "{{colors.on_primary.default.hex}}"
selection_background = "{{colors.primary.default.hex}}"

# Background shades
bg = "{{colors.background.default.hex}}"
lighter_bg = "{{colors.surface_container.default.hex}}"
dark_bg = "{{colors.surface_dim.default.hex}}"
darker_bg = "{{colors.surface_dim.default.hex}}"

# Foreground shades
fg = "{{colors.on_surface.default.hex}}"
light_fg = "{{colors.on_surface.default.hex}}"
bright_fg = "{{colors.on_surface.default.hex}}"
dark_fg = "{{colors.on_surface_variant.default.hex}}"
muted = "{{colors.outline.default.hex}}"
selection = "{{colors.surface_container.default.hex}}"

# Accent hues
red = "{{colors.error.default.hex}}"
green = "{{colors.tertiary.default.hex}}"
yellow = "{{colors.secondary.default.hex}}"
blue = "{{colors.primary.default.hex}}"
magenta = "{{colors.tertiary_container.default.hex}}"
cyan = "{{colors.secondary_container.default.hex}}"
orange = "{{colors.error_container.default.hex}}"
brown = "{{colors.outline.default.hex}}"

# Bright hues
bright_red = "{{colors.error_container.default.hex}}"
bright_green = "{{colors.tertiary.default.hex}}"
bright_yellow = "{{colors.secondary_container.default.hex}}"
bright_blue = "{{colors.primary_container.default.hex}}"
bright_magenta = "{{colors.tertiary_container.default.hex}}"
bright_cyan = "{{colors.secondary.default.hex}}"

# Normal colors (ANSI 0-7)
color0 = "{{colors.surface.default.hex}}"
color1 = "{{colors.error.default.hex}}"
color2 = "{{colors.tertiary.default.hex}}"
color3 = "{{colors.secondary.default.hex}}"
color4 = "{{colors.primary.default.hex}}"
color5 = "{{colors.tertiary_container.default.hex}}"
color6 = "{{colors.secondary_container.default.hex}}"
color7 = "{{colors.on_surface.default.hex}}"

# Bright colors (ANSI 8-15)
color8 = "{{colors.outline.default.hex}}"
color9 = "{{colors.error_container.default.hex}}"
color10 = "{{colors.tertiary.default.hex}}"
color11 = "{{colors.secondary.default.hex}}"
color12 = "{{colors.primary.default.hex}}"
color13 = "{{colors.tertiary_container.default.hex}}"
color14 = "{{colors.primary_container.default.hex}}"
color15 = "{{colors.on_surface.default.hex}}"
